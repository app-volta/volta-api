name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: app-volta/volta-devops/.github/workflows/reusable-validate-pr.yaml@v1

  build-test:
    name: build-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: volta_test
          POSTGRES_USER: volta
          POSTGRES_PASSWORD: volta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volta -d volta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/volta_test
      DATABASE_HOST: localhost:5432
      DATABASE_USERNAME: volta
      DATABASE_PASSWORD: volta
      JWT_KEY: chave-somente-para-testes-com-mais-de-32-bytes
      JWT_EXPIRATION: "3600000"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e empacotamento
        run: mvn --batch-mode verify

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-surefire
          path: target/surefire-reports/
          retention-days: 5