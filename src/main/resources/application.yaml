server:
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: volta-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}/${DATABASE_NAME}?sslmode=require&channel_binding=require
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      max-lifetime: 600000
      validation-timeout: 3000
      idle-timeout: 30000
      minimum-idle: 1
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true

jwt:
  expiration: ${JWT_EXPIRATION:3600000}
  key: ${JWT_KEY}

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
  company-id: ${ADMIN_COMPANY_ID:}

swagger:
  username: ${SWAGGER_USERNAME:}
  password: ${SWAGGER_PASSWORD:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true