server:
  port: 8080
spring:
  application:
    name: volta-api
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}/neondb?sslmode=require&channel_binding=require
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      max-lifetime: 600000
      validation-timeout: 3000
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    baseline-on-migrate: true
jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_KEY}